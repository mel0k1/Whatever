name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mingw64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config flex bison gperf perl zip nsis \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 curl

      - name: Cache cross build
        uses: actions/cache@v4
        with:
          path: |
            ns-src-win64
            inst-win64
            inst-native
            build/x86_64-w64-mingw32-windows
          key: win64-${{ hashFiles('tools/cross-windows.sh') }}

      - name: Cross build (mingw64)
        run: ./tools/cross-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: whatever-win64
          path: |
            whatever-win64.zip
            whatever-win64-setup.exe
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            whatever-win64.zip
            whatever-win64-setup.exe
